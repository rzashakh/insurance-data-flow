apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: data-lab-cluster
spec:
  instances: 3

  postgresql:
    parameters:
      wal_level: logical          
      max_replication_slots: "10"
      max_wal_senders: "10"       

  bootstrap:
    initdb:
      database: insurance        
      owner: insurance_user      
      secret:
        name: insurance-user-secret 

  storage:
    size: 1Gi
    storageClass: local-path